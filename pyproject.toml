[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-verdict"
version = "0.1.0"
description = "Auditable Jev-powered workflow gates with cache, ledger, policy, and stability measurement."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "lifeporterlab"}]
dependencies = []

[project.scripts]
jev-verdict = "jev_verdict.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
